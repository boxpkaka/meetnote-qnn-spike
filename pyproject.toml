[project]
name = "meetnote-qnn-tooling"
version = "0.1.0"
description = "Reproducible tooling for the pinned MeetNote QNN model release"
requires-python = ">=3.10,<3.14"
dependencies = []

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.10"
include = ["tools"]
exclude = ["third_party", "sdk", ".venv"]
