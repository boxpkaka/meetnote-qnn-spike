name: Repository quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: python3 -m pip install --requirement requirements-dev.lock
      - run: python3 tools/check_repository.py
      - run: python3 tools/test_prepare_meeting_datasets.py
      - run: python3 tools/test_environment.py
      - run: python3 tools/test_release_tooling.py
      - run: shellcheck tools/*.sh
      - run: node --check tools/compare_teacher_forced_logits.mjs
      - run: >-
          ruff check
          tools/analyze_qnn_runtime_log.py
          tools/check_environment.py
          tools/hf_teacher_forced_logits.py
          tools/prepare_meeting_datasets.py
          tools/prepare_omni_calibration.py
          tools/test_environment.py
          tools/test_prepare_meeting_datasets.py
          tools/test_release_tooling.py
          tools/verify_cpu_release_candidate.py
          tools/verify_release_manifest.py
          tools/verify_source_manifest.py

  mnn-patches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Fetch the pinned MNN revision
        run: |
          git init third_party/MNN
          git -C third_party/MNN remote add origin https://github.com/alibaba/MNN.git
          git -C third_party/MNN fetch --depth=1 origin 0bff03cbef43c783f44e41484b9f8a0b28bd758d
          git -C third_party/MNN checkout --detach FETCH_HEAD
      - run: python3 tools/check_repository.py --mnn-root third_party/MNN
